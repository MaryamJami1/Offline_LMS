name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lingualab
          POSTGRES_PASSWORD: lingualab
          POSTGRES_DB: lingualab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingualab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lingualab:lingualab@localhost:5432/lingualab_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm --filter @lingualab/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
