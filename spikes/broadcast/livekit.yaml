# Mirrors infra/livekit.yaml so the spike exercises the real port layout.
#
# node_ip and keys are NOT in this file: livekit-server does not expand ${VAR}
# inside its config, so run-livekit.ps1 supplies them at launch from .env via
# the --node-ip flag and the LIVEKIT_KEYS environment variable.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
logging:
  level: info
