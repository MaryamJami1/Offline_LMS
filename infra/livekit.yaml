# Ports match infra/docker-compose.yml and spikes/broadcast/livekit.yaml.
#
# node_ip and keys are NOT in this file: livekit-server does not expand ${VAR}
# inside its config, so docker-compose.yml supplies them from infra/.env through
# the --node-ip flag and the LIVEKIT_KEYS environment variable.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
logging:
  level: info
